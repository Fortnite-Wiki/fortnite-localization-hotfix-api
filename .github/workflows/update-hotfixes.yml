name: Collect localization hotfixes

on:
  workflow_dispatch:
  schedule:
    # Check every five minutes; scheduled runs may start late.
    - cron: '1-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: fortnite-hotfix-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      EPIC_CLIENT_ID: ${{ secrets.EPIC_CLIENT_ID }}
      EPIC_CLIENT_SECRET: ${{ secrets.EPIC_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials are configured
        id: credentials
        shell: bash
        run: |
          if [ -n "$EPIC_CLIENT_ID" ] && [ -n "$EPIC_CLIENT_SECRET" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping: configure authorized EPIC_CLIENT_ID and EPIC_CLIENT_SECRET repository secrets.'
          fi

      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Run collector
        if: steps.credentials.outputs.ready == 'true'
        run: python hotfix_probe.py --auth client --no-prompt --only-on-change --output data

      - name: Commit data when hotfixes change
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current.json data/last_changes.json
          if [ -f data/history.jsonl ]; then git add data/history.jsonl; fi
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update Fortnite localization hotfixes'
            git push
          fi
